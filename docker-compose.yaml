version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: clinique_pro
      MYSQL_ROOT_PASSWORD: ${mdpdb}
    networks:
      - health-net
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/clinique_pro
      - SPRING_DATASOURCE_USERNAME=${username}
      - SPRING_DATASOURCE_PASSWORD=${mdpdb}
    networks:
      - health-net

networks:
  health-net:
    driver: bridge

volumes:
  mysql_data: